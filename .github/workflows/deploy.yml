name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: sl4mtv_news_bot
          path: target/release/sl4mtv_news_bot
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: sl4mtv_news_bot
          path: ./

      - name: Send binary to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: sl4mtv_news_bot
          target: /usr/telegram_bots/sl4mtv_news_bot

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            chmod +x /usr/telegram_bots/sl4mtv_news_bot/sl4mtv_news_bot
            
            sudo systemctl restart sl4mtv-news-bot
            echo "Health check started"
            
            for i in {1..24}; do
                sleep 5
                if curl -sf http://127.0.0.1:50001/health > /dev/null; then
                    echo "Passed"
                    exit 0
                fi
            done
            echo "Failed"
            exit 1