name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sl4mtv_news_bot
          path: target/release/sl4mtv_news_bot
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: sl4mtv_news_bot
          path: ./binary

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cp ./binary/sl4mtv_news_bot /usr/telegram_bots/sl4mtv_news_bot/sl4mtv_news_bot
            chmod +x /usr/telegram_bots/sl4mtv_news_bot/sl4mtv_news_bot
            
            sudo systemctl restart sl4mtv_news_bot
            sleep 2
            if curl -sf http://127.0.0.1:50001/health > /dev/null; then
              echo "Health check passed"
            else
              echo "Health check failed"
              exit 1
            fi
